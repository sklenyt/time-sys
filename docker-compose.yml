# Redis se tu záměrně nevede — appka dnes žádné nemá (živé výsledky běží
# přes in-process Subject, ne pub/sub, viz docs/15-produkcni-nasazeni.md
# §15.4). Přidat zpátky až ve chvíli, kdy se skutečně škáluje na víc než
# jednu instanci API, ne preventivně.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: depo
      POSTGRES_PASSWORD: depo_dev_password
      POSTGRES_DB: depo_dev
    ports:
      - "5432:5432"
    volumes:
      - depo-postgres-data:/var/lib/postgresql/data

volumes:
  depo-postgres-data:
