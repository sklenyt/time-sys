services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: depo
      POSTGRES_PASSWORD: depo_dev_password
      POSTGRES_DB: depo_dev
    ports:
      - "5432:5432"
    volumes:
      - depo-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  depo-postgres-data:
