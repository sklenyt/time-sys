<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 716" width="680" height="716" font-family="Helvetica, Arial, sans-serif" role="img"><title>Podrobný přehled infrastruktury Depo</title><rect width="680" height="716" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="30" y="40" width="610" height="104" rx="8" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><text x="42" y="58" font-size="12" fill="#5F5E5A">Klienti v prohlížeči (PWA)</text><rect x="40" y="74" width="140" height="58" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="110.0" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Aplikace</text><text x="110.0" y="116" text-anchor="middle" font-size="12" fill="#5F5E5A">organizátor, app.</text><rect x="190" y="74" width="140" height="58" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="260.0" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Veřejné výsledky</text><text x="260.0" y="116" text-anchor="middle" font-size="12" fill="#5F5E5A">vysledky., živě</text><rect x="340" y="74" width="140" height="58" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="410.0" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Embed a kiosk</text><text x="410.0" y="116" text-anchor="middle" font-size="12" fill="#5F5E5A">iframe, TV v cíli</text><rect x="490" y="74" width="140" height="58" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="560.0" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">Měření v cíli</text><text x="560.0" y="116" text-anchor="middle" font-size="12" fill="#5F5E5A">funguje i offline</text><rect x="40" y="190" width="190" height="56"