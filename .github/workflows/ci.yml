name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@depo/shared
      # Bez vygenerovaného Prisma Clienta (postinstall to nedělá) by @prisma/client
      # exportoval jen prázdný výchozí stub bez modelových typů — typecheck/build
      # apps/api by pak selhaly na chybějících typech (Prihlaska, ZaznamUdalosti, …).
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  api-tests:
    name: API unit + e2e tests
    runs-on: ubuntu-latest
    services:
      # POSTGRES_USER here is deliberately NOT the role the app connects as:
      # Docker's official postgres image makes it the cluster's bootstrap
      # superuser, and Postgres refuses to ever let the bootstrap user shed
      # its own superuser bit ("The bootstrap user must have the SUPERUSER
      # attribute") — ALTER ROLE ... NOSUPERUSER on it fails outright. A
      # superuser bypasses Row-Level Security entirely regardless of FORCE
      # ROW LEVEL SECURITY (see docs/08-security.md §8.9), so a real,
      # separate, non-superuser app role is required to test RLS at all.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: depo_bootstrap_password
          POSTGRES_DB: depo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://depo:depo_test_password@localhost:5432/depo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@depo/shared
      - run: |
          PGPASSWORD=depo_bootstrap_password psql -h localhost -U postgres -d depo_test -c "
            CREATE ROLE depo LOGIN PASSWORD 'depo_test_password' NOSUPERUSER;
            GRANT ALL PRIVILEGES ON DATABASE depo_test TO depo;
            GRANT ALL ON SCHEMA public TO depo;
          "
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
      - run: npm run test --workspace=apps/api
      - run: npm run test:e2e --workspace=apps/api

  web-tests:
    name: Web unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@depo/shared
      - run: npm run test --workspace=apps/web
