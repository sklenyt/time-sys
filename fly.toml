# fly.toml app configuration file generated for depo-time on 2026-09-21T13:42:22+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'depo-time'
primary_region = 'ams'

[build]
  dockerfile = 'apps/api/Dockerfile'

[deploy]
  # Migrace běží uvnitř Fly sítě před nastartováním nových strojů — ne z
  # GitHub Actions runneru, který nemá IPv6 a Supabase Direct connection
  # (db.xniuzsdyshhbxhqjhtpm.supabase.co) je jen přes IPv6 bez placeného
  # IPv4 add-onu. Fly.io appka se přes Direct connection prokazatelně
  # připojuje bez problémů (viz docs/15-produkcni-nasazeni.md §15.10.1).
  release_command = 'npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
