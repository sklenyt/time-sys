# Příklad nasazení na vlastní VPS (viz docs/08-security.md §8.8 varianta 2,
# docs/15-produkcni-nasazeni.md) — Postgres + obě appky + Caddy jako reverzní
# proxy s automatickým Let's Encrypt TLS. Pro managed Postgres (§15.2)
# postgres/depo-postgres-data blok prostě smazat a DATABASE_URL v .env
# nastavit na adresu poskytovatele.
#
# Použití:
#   1. cp .env.prod.example .env.prod   (a doplnit skutečné hodnoty)
#   2. Nahradit "tvuj-domenu.cz" v Caddyfile skutečnou doménou.
#   3. docker compose -f docker-compose.prod.yml up -d --build
#   4. Jednorázově spustit migrace (aplikační role, ne postgres/superuser — §8.9):
#      docker compose -f docker-compose.prod.yml exec api npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
#
# Neověřeno reálným nasazením (sandboxované vývojové prostředí bez Docker
# daemonu) — před prvním ostrým použitím projít krok za krokem na vlastním VPS.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - depo-postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      - postgres
    volumes:
      # Fotodůkaz sporných doběhů (F41) se ukládá na lokální disk appky
      # (apps/api/src/records/records.service.ts, process.cwd()/uploads) —
      # bez pojmenovaného volume by fotky zmizely při každém redeploy/restartu.
      - depo-api-uploads:/repo/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: https://api.tvuj-domenu.cz/api/v1
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - depo-caddy-data:/data
      - depo-caddy-config:/config
    depends_on:
      - api
      - web

volumes:
  depo-postgres-data:
  depo-api-uploads:
  depo-caddy-data:
  depo-caddy-config:
