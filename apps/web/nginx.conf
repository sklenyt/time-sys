# SPA fallback — React Router dělá vlastní klientské směrování (/dashboard,
# /mereni/:id, ...), takže každá neznámá cesta se musí vrátit jako
# index.html, ne 404, jinak by reload na jakékoli podstránce spadl.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker a manifest (vite-plugin-pwa) nikdy necachovat agresivně,
    # jinak klient nedostane novou verzi appky po nasazení.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
}
